[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py310"
line-length = 120
exclude = [
    ".venv",
    "build",
    "dist",
    "build_staging",
    "__pycache__",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "RUF", # ruff-specific rules
]
ignore = [
    "E501",   # Line too long
    "RUF012", # Mutable class attributes
    "RUF001", # Ambiguous unicode character (deutsche Gedankenstriche in Texten)
]

[tool.ruff.lint.isort]
known-first-party = ["models", "generator", "security", "gui", "version"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["."]
python_files = ["test_*.py"]
addopts = "-v --cov=. --cov-report=term-missing"

[tool.coverage.run]
omit = [
    "*/.venv/*",
    "build_exe.py",
    "sichern.py",
    "test_*.py",
]

[tool.bandit]
exclude_dirs = [
    "./.venv",
    "./build",
    "./dist",
    "./build_staging",
]
skips = ["B404", "B603"]
