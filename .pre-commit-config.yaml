# Pre-commit Configuration for boostrap5-editor
repos:
  # Standard-Checks: Dateiendungen, Syntax, Dateigrößen
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=10000']

  # Ruff: Schneller Linter und Formatter für Python
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.3.5
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # Bandit: Sicherheitsanalyse für Python-Code (Nur Medium/High-Fehler blockieren)
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.8
    hooks:
      - id: bandit
        args: ["-r", ".", "-ll", "-x", "./.venv,./build,./dist,./build_staging,./test_*.py"]
        pass_filenames: false

  # Lokaler Hook für pytest (führt Unit-Tests aus)
  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: pytest
        language: system
        types: [python]
        pass_filenames: false
